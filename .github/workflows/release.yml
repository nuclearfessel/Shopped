name: Release

# App updates on main are published. README and docs changes are not a new
# release. Each publish keeps only the three newest releases.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'

concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.bump.outputs.name }}
      code: ${{ steps.bump.outputs.code }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Bump release version
        id: bump
        run: |
          # Patch 0..9, then minor+1; minor 0..9, then major+1 (9.9.9 → 10.0.0).
          # Compute only here. Publish rewrites pubspec after a successful release
          # so a failed build can retry the same next version.
          next=$(python3 tool/bump_release_version.py)
          # Re-emit step outputs explicitly so build jobs always receive them.
          name="${next%%+*}"
          code="${next##*+}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "tag=v$name" >> "$GITHUB_OUTPUT"
          echo "Publishing $next"

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # 3.50 marks package:flutter/material.dart deprecated; pin the last
          # green release SDK until Shopped migrates imports.
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Set up Python for source icon gate
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Verify source icon contract
        run: |
          python -m pip install -r tool/icon-requirements.txt
          python tool/validate_app_icons.py
          python tool/check_icon_artwork.py

      - name: Analyze and test
        run: |
          flutter analyze
          flutter test

  android:
    needs: [version, check]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # 3.50 marks package:flutter/material.dart deprecated; pin the last
          # green release SDK until Shopped migrates imports.
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Configure Android sideload signing
        run: |
          # Same committed sideload.jks on every runner so APKs can replace each other.
          printf '%s\n' \
            'storePassword=shopped-sideload' \
            'keyPassword=shopped-sideload' \
            'keyAlias=shopped' \
            'storeFile=sideload.jks' \
            > android/key.properties

      - name: Build Android APK
        run: |
          flutter build apk --release \
            --build-name=${{ needs.version.outputs.name }} \
            --build-number=${{ needs.version.outputs.code }}
          cp build/app/outputs/flutter-apk/app-release.apk "Shopped-${{ needs.version.outputs.name }}.apk"
          STAGE="$GITHUB_WORKSPACE/build/android-package"
          mkdir -p "$STAGE"
          cp "Shopped-${{ needs.version.outputs.name }}.apk" "$STAGE/"
          cp installer/Install-Shopped-Android.sh installer/Install-Shopped-Android.ps1 "$STAGE/"
          chmod +x "$STAGE/Install-Shopped-Android.sh"
          (
            cd "$STAGE"
            zip -r "$GITHUB_WORKSPACE/Shopped-${{ needs.version.outputs.name }}-android.zip" \
              "Shopped-${{ needs.version.outputs.name }}.apk" \
              Install-Shopped-Android.sh \
              Install-Shopped-Android.ps1
          )

      - name: Set up Python for APK icon gate
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Verify packaged Android launcher icons
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r tool/icon-requirements.txt
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK"
          AAPT="$(find "$SDK/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT"
          python tool/check_android_apk_icons.py --android-apk "Shopped-${{ needs.version.outputs.name }}.apk" --aapt "$AAPT"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: |
            Shopped-${{ needs.version.outputs.name }}.apk
            Shopped-${{ needs.version.outputs.name }}-android.zip

  windows:
    needs: [version, check]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # 3.50 marks package:flutter/material.dart deprecated; pin the last
          # green release SDK until Shopped migrates imports.
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows app
        run: |
          flutter config --enable-windows-desktop
          flutter build windows --release `
            --build-name=${{ needs.version.outputs.name }} `
            --build-number=${{ needs.version.outputs.code }}

      - name: Set up Python for Windows icon gate
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Verify compiled Windows icon
        shell: pwsh
        run: |
          python -m pip install -r tool/native-requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "Icon checker dependencies failed" }
          $exe = "build/windows/x64/runner/Release/shopped.exe"
          python tool/check_built_icons.py --windows-exe "$exe"
          if ($LASTEXITCODE -ne 0) { throw "Compiled Windows icon failed" }
          python tool/check_built_version.py --windows-exe "$exe" --expected-version "${{ needs.version.outputs.name }}" --expected-build "${{ needs.version.outputs.code }}"
          if ($LASTEXITCODE -ne 0) { throw "Compiled Windows version failed" }

      - name: Build installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=${{ needs.version.outputs.name }}" "installer/shopped.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Windows installer payload
        shell: pwsh
        run: |
          # This is a disposable hosted runner, never a user's installed app.
          $installer = (Resolve-Path "build/installer/Shopped-Setup-${{ needs.version.outputs.name }}.exe").Path
          $target = Join-Path $env:RUNNER_TEMP "Shopped-icon-verification"
          $arguments = "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=`"$target`""
          $result = Start-Process -FilePath $installer -ArgumentList $arguments -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Verification install failed" }
          $exe = Join-Path $target "shopped.exe"
          python tool/check_built_icons.py --windows-exe "$exe"
          if ($LASTEXITCODE -ne 0) { throw "Installer-payload icon failed" }
          python tool/check_built_version.py --windows-exe "$exe" --expected-version "${{ needs.version.outputs.name }}" --expected-build "${{ needs.version.outputs.code }}"
          if ($LASTEXITCODE -ne 0) { throw "Installer-payload version failed" }
          # Same-version override path: install again over the detection registry entry.
          $result = Start-Process -FilePath $installer -ArgumentList $arguments -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Same-version override install failed" }
          python tool/check_built_version.py --windows-exe "$exe" --expected-version "${{ needs.version.outputs.name }}" --expected-build "${{ needs.version.outputs.code }}"
          if ($LASTEXITCODE -ne 0) { throw "Same-version override version failed" }

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: build/installer/Shopped-Setup-${{ needs.version.outputs.name }}.exe

  macos:
    needs: [version, check]
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # 3.50 marks package:flutter/material.dart deprecated; pin the last
          # green release SDK until Shopped migrates imports.
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS app
        run: |
          flutter config --enable-macos-desktop
          flutter build macos --release \
            --build-name=${{ needs.version.outputs.name }} \
            --build-number=${{ needs.version.outputs.code }}
          STAGE="$GITHUB_WORKSPACE/build/macos-package"
          mkdir -p "$STAGE"
          cp -R build/macos/Build/Products/Release/Shopped.app "$STAGE/"
          cp installer/Install-Shopped.command installer/Uninstall-Shopped.command "$STAGE/"
          chmod +x "$STAGE/Install-Shopped.command" "$STAGE/Uninstall-Shopped.command"
          (
            cd "$STAGE"
            zip -r "$GITHUB_WORKSPACE/Shopped-${{ needs.version.outputs.name }}-macos.zip" \
              Shopped.app Install-Shopped.command Uninstall-Shopped.command
          )

      - name: Set up Python for macOS icon gate
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Verify compiled and packaged macOS icons
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r tool/native-requirements.txt
          PAYLOAD="$RUNNER_TEMP/Shopped-icon-verification"
          mkdir -p "$PAYLOAD"
          ditto -x -k "Shopped-${{ needs.version.outputs.name }}-macos.zip" "$PAYLOAD"
          for APP in "build/macos/Build/Products/Release/Shopped.app" "$PAYLOAD/Shopped.app"; do
            python tool/check_built_icons.py --macos-app "$APP"
            python tool/check_built_version.py --macos-app "$APP" --expected-version "${{ needs.version.outputs.name }}" --expected-build "${{ needs.version.outputs.code }}"
          done

      - name: Upload Mac app
        uses: actions/upload-artifact@v7
        with:
          name: macos-app
          path: Shopped-${{ needs.version.outputs.name }}-macos.zip

  ios:
    needs: [version, check]
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # 3.50 marks package:flutter/material.dart deprecated; pin the last
          # green release SDK until Shopped migrates imports.
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ios

      - name: Cache iOS Distribution certificate
        uses: actions/cache@v4
        with:
          path: ios/fastlane/signing-cache
          key: ios-distribution-cert-v1

      - name: Build signed IPA and upload to TestFlight
        working-directory: ios
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          BUILD_NAME: ${{ needs.version.outputs.name }}
          BUILD_NUMBER: ${{ needs.version.outputs.code }}
        run: |
          set -euo pipefail
          if [[ -z "${APP_STORE_CONNECT_KEY_ID}" || -z "${APP_STORE_CONNECT_ISSUER_ID}" || -z "${APP_STORE_CONNECT_PRIVATE_KEY}" ]]; then
            echo "Missing App Store Connect secrets. Add APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID, and APP_STORE_CONNECT_PRIVATE_KEY."
            exit 1
          fi
          bundle exec fastlane testflight_release

      - name: Package iOS install zip
        run: |
          set -euo pipefail
          STAGE="$GITHUB_WORKSPACE/build/ios-package"
          mkdir -p "$STAGE"
          cp installer/Install-Shopped-iOS.command "$STAGE/"
          chmod +x "$STAGE/Install-Shopped-iOS.command"
          IPA=$(ls -1 build/ios/ipa/*.ipa | head -n 1)
          cp "$IPA" "$STAGE/Shopped-${{ needs.version.outputs.name }}.ipa"
          cp "$IPA" "Shopped-${{ needs.version.outputs.name }}.ipa"
          (
            cd "$STAGE"
            zip -r "$GITHUB_WORKSPACE/Shopped-${{ needs.version.outputs.name }}-ios-install.zip" \
              Install-Shopped-iOS.command "Shopped-${{ needs.version.outputs.name }}.ipa"
          )

      - name: Upload iOS packages
        uses: actions/upload-artifact@v7
        with:
          name: ios-install
          path: |
            Shopped-${{ needs.version.outputs.name }}-ios-install.zip
            Shopped-${{ needs.version.outputs.name }}.ipa

  publish:
    needs: [version, android, windows, macos, ios]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          path: packages
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.name }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          notes="Shopped ${VERSION}. Windows: run Shopped-Setup-${VERSION}.exe (overrides the same version, replaces a previous version and keeps lists/settings). Android: open Shopped-${VERSION}.apk, or use Install-Shopped-Android.sh/.ps1 from Shopped-${VERSION}-android.zip with adb. Mac: unzip Shopped-${VERSION}-macos.zip and run Install-Shopped.command. iOS: this release uploads a signed build to TestFlight automatically — install or update from the TestFlight app on your iPhone/iPad (App Store Connect → TestFlight when the build is Ready to Test). The ios-install zip also includes the signed IPA. Uninstall from Windows Apps and Features (or the Start Menu Uninstall shortcut), from Android/iOS by removing the app, or on a Mac with Uninstall-Shopped.command. Uninstall removes the app and its lists, settings, and data folders."
          assets=(
            "packages/Shopped-${VERSION}.apk"
            "packages/Shopped-${VERSION}-android.zip"
            "packages/Shopped-Setup-${VERSION}.exe"
            "packages/Shopped-${VERSION}-macos.zip"
            "packages/Shopped-${VERSION}-ios-install.zip"
            "packages/Shopped-${VERSION}.ipa"
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; replacing its packages."
            gh release upload "$TAG" "${assets[@]}" --clobber
            gh release edit "$TAG" --notes "$notes"
            exit 0
          fi
          gh release create "$TAG" \
            "${assets[@]}" \
            --title "$VERSION" \
            --notes "$notes"
          # The release section keeps the three newest releases.
          gh release list --limit 50 --json tagName,publishedAt \
            --jq 'sort_by(.publishedAt) | reverse | .[3:] | .[].tagName' \
            | while read -r old; do
                [ -z "$old" ] && continue
                gh release delete "$old" --yes --cleanup-tag
              done

      - name: Record version in pubspec and docs
        run: |
          python3 tool/bump_release_version.py --write
          python3 tool/sync_release_docs.py --version "${{ needs.version.outputs.name }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml README.md docs/index.html
          if git diff --cached --quiet; then
            echo "Release docs already at ${{ needs.version.outputs.name }}"
            exit 0
          fi
          git commit -m "Release ${{ needs.version.outputs.name }}."
          git push
          # GITHUB_TOKEN pushes do not re-trigger workflows.
